<title>SEHAN’S PHONE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-shaped device centered on a dark stage. Lock screen slides up to a home screen; apps scale open over it. */
:root{
  --stage:#0b0b10;
  --ink:#ffffff;
  --ink-soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.2);
  --glass-deep:rgba(24,24,32,.42);
  --paper:#f2f2f7;
  --paper-card:#ffffff;
  --paper-ink:#111114;
  --paper-soft:#8a8a90;
  --line:rgba(60,60,67,.18);
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{
  position:relative;width:min(100%,390px);height:min(100%,844px);min-height:0;
  border-radius:46px;overflow:hidden;background:#000;
  box-shadow:0 0 0 7px #1c1c22,0 0 0 8px #34343d,0 30px 80px rgba(0,0,0,.6);
  isolation:isolate;
}
.wall{position:absolute;inset:0;z-index:0;transition:background .5s}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60}
.status{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:6px 30px 0 34px;font-weight:600;font-size:16px;pointer-events:none;color:#fff;transition:color .25s;
}
.phone[data-bar="dark"] .status{color:var(--paper-ink)}
.status svg{display:block;fill:currentColor}
.sys{display:flex;gap:6px;align-items:center}
.homebar{
  position:absolute;bottom:0;left:0;right:0;height:34px;z-index:55;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;touch-action:none;user-select:none;
}
.homebar i{display:block;width:128px;height:5px;border-radius:3px;background:#fff;opacity:.9;transition:background .25s,transform .3s cubic-bezier(.3,.8,.2,1)}
.homebar.drag i{transition:background .25s}
.phone[data-bar="dark"] .homebar i{background:#111}
.screen{position:absolute;inset:0;z-index:10}

.lock.gone{transform:translateY(-105%);opacity:0;pointer-events:none}
.lock .date{margin-top:92px;font-size:20px;font-weight:600;color:var(--ink-soft)}
.lock .time{font-size:92px;line-height:1;font-weight:700;letter-spacing:-2px;margin-top:2px;font-variant-numeric:tabular-nums}
.lock .quick{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:space-between;padding:0 46px}
.lock .quick span{width:50px;height:50px;border-radius:50%;background:var(--glass-deep);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center}
.lock .unlock{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);padding:8px 20px;font-size:14px;font-weight:500;color:var(--ink-soft);letter-spacing:.2px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* Home screen */
.home{padding:62px 18px 0;display:flex;flex-direction:column;transition:transform .35s,opacity .35s,filter .35s}
.home.away{transform:scale(.92);opacity:0;filter:blur(8px);pointer-events:none}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.widget{aspect-ratio:1;border-radius:26px;padding:14px;background:var(--glass-deep);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.widget .k{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red)}
.widget .big{font-size:46px;font-weight:300;line-height:1}
.widget .sm{font-size:13px;color:var(--ink-soft);line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}
.app-btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.app-btn .icon{width:100%;max-width:62px;aspect-ratio:1;border-radius:22.5%;overflow:hidden;display:block;transition:transform .15s}
.app-btn:active .icon{transform:scale(.9)}
.app-btn .icon svg{display:block;width:100%;height:100%}
.app-btn .lbl{font-size:11.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dots{margin-top:auto;display:flex;justify-content:center;gap:7px;padding-bottom:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i:first-child{background:#fff}
.dock{margin:0 -4px 30px;padding:14px 16px;border-radius:34px;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dock .lbl{display:none}

/* App shell */
.app{position:absolute;inset:0;z-index:30;background:var(--paper);color:var(--paper-ink);padding-top:54px;display:flex;flex-direction:column;transform:scale(.8);opacity:0;border-radius:46px;transition:transform .28s cubic-bezier(.3,.8,.2,1),opacity .22s}
.app.in{transform:none;opacity:1}
.app.black{background:#000;color:#fff}
.app .bar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;min-height:46px}
.app .bar h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px}
.app .bar .link{color:var(--orange);font-size:17px;font-weight:500;padding:6px 2px}
.app .body{flex:1;min-height:0;overflow:auto;padding:0 16px 40px}
.card{background:var(--paper-card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.muted{color:var(--paper-soft)}
input[type=text],textarea{font:inherit;color:inherit}

/* Calculator */
.calc{display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 40px;flex:1;gap:12px}
.calc .out{text-align:right;font-weight:300;line-height:1;padding:0 10px 4px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.keys button{aspect-ratio:1;border-radius:50%;font-size:30px;background:#333336;display:grid;place-items:center;transition:filter .1s}
.keys button:active{filter:brightness(1.5)}
.keys .fn{background:#a5a5a8;color:#000}
.keys .op{background:var(--orange)}
.keys .op.on{background:#fff;color:var(--orange)}
.keys .zero{grid-column:span 2;aspect-ratio:auto;border-radius:40px;justify-content:start;padding-left:9%;display:flex;align-items:center}

/* Notes */
.note-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-sub{font-size:13px;color:var(--paper-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor{width:100%;height:100%;min-height:300px;border:0;background:transparent;resize:none;font-size:17px;line-height:1.45;outline-offset:-2px}

/* Clock */
.digital{font-size:78px;font-weight:200;text-align:center;margin:30px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tabs{display:flex;background:#e3e3e8;border-radius:10px;padding:2px;margin:8px 0 18px}
.tabs button{flex:1;padding:7px;border-radius:8px;font-size:14px;font-weight:500}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 24px}
.ctl{display:flex;justify-content:space-between;padding:0 8px;margin-bottom:18px}
.ctl button{width:78px;height:78px;border-radius:50%;font-size:16px;font-weight:500}
.ctl .a{background:#e3e3e8}
.ctl .go{background:#d9f7e2;color:#1a8f3e}
.ctl .stop{background:#ffdcd9;color:#d3291f}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center;font-variant-numeric:tabular-nums}
.cal .h{font-size:12px;font-weight:600;color:var(--paper-soft);padding-bottom:6px}
.cal .d{height:42px;display:grid;place-items:center;font-size:17px}
.cal .d span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.cal .today span{background:var(--red);color:#fff;font-weight:600}

/* Messages */
.chat{flex:1;min-height:0;overflow:auto;padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:76%;padding:9px 14px;border-radius:18px;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.bub.in{background:#e5e5ea;align-self:flex-start;border-bottom-left-radius:5px}
.bub.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.compose{display:flex;gap:8px;padding:8px 12px 34px;align-items:center;border-top:1px solid var(--line);background:var(--paper)}
.compose input{flex:1;min-width:0;border:1px solid #c7c7cc;border-radius:20px;padding:9px 14px;font-size:16px;background:#fff}
.compose button{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;font-weight:700}

/* Reminders */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #c0c0c6;flex:none;display:grid;place-items:center}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done{text-decoration:line-through;color:var(--paper-soft)}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.add button{padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600}

/* Settings */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px}
.sw-btn{aspect-ratio:9/16;border-radius:10px;border:3px solid transparent;transition:border-color .15s}
.sw-btn.on{border-color:var(--blue)}
.sec{font-size:13px;font-weight:500;color:var(--paper-soft);text-transform:uppercase;letter-spacing:.4px;padding:18px 16px 7px}

/* Weather */
.wx{min-height:100%;margin:0 -16px;padding:10px 16px 40px;color:#fff;background:linear-gradient(180deg,#2f6fb5,#6aa8e6 70%,#9cc8f0)}
.wx .city{text-align:center;font-size:30px;margin-top:6px}
.wx .temp{text-align:center;font-size:92px;font-weight:200;line-height:1;margin:4px 0}
.wx .cond{text-align:center;font-size:19px;opacity:.9}
.wx .panel{background:rgba(255,255,255,.22);border-radius:16px;margin-top:18px;padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.wx .hours{display:flex;gap:22px;overflow-x:auto;padding:4px 2px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.wx .hours div{display:flex;flex-direction:column;gap:8px;align-items:center;flex:none}
.wx .day{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.25);font-size:17px;font-variant-numeric:tabular-nums}
.wx .day:first-of-type{border-top:0}
.note-fine{font-size:12px;text-align:center;opacity:.8;margin-top:14px}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}
.photos i{aspect-ratio:1;display:block}

/* Placeholder app */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 40px 60px}
.empty .icon{width:92px;aspect-ratio:1;border-radius:22.5%;overflow:hidden}
.empty .icon svg{display:block;width:100%;height:100%}
.empty p{margin:0;color:var(--paper-soft);font-size:16px;line-height:1.4}

/* Passcode */
.pass{z-index:20;display:flex;flex-direction:column;align-items:center;background:rgba(8,12,8,.38);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2);opacity:0;pointer-events:none;transition:opacity .3s}
.pass.show{opacity:1;pointer-events:auto}
.p-title{margin-top:104px;font-size:20px;font-weight:600}
.p-dots{display:flex;gap:22px;margin-top:26px}
.p-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
.p-dots i.on{background:#fff}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.p-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px;margin-top:48px;justify-content:center}
.p-key{width:76px;height:76px;border-radius:50%;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .12s}
.p-key:active{background:rgba(255,255,255,.55)}
.p-key b{font-size:34px;font-weight:400}
.p-key small{font-size:10px;font-weight:600;letter-spacing:2px;height:12px;margin-top:3px}
.p-side{width:76px;height:76px;font-size:17px;font-weight:500;align-self:center}
.app.drag,.lock.drag{transition:none}

@media (max-width:430px){.phone{border-radius:40px;box-shadow:0 0 0 1px #2a2a32}.app{border-radius:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  }
  function showPass(){ passOpen=true; busy=false; entry=''; pTitle.textContent='Enter Passcode'; drawPass(); pass.classList.add('show') }
  function hidePass(){ passOpen=false; busy=false; entry=''; pass.classList.remove('show'); pTitle.textContent='Enter Passcode'; drawPass() }
  function resetPass(){ hidePass() }
  function enterDigit(k){
    if(!passOpen||busy||entry.length>=4) return;
    if(entry.length===0) pTitle.textContent='Enter Passcode';
    entry+=k; drawPass();
    if(entry.length===4){
      busy=true;
      setTimeout(function(){
        if(entry===PASSCODE){ hidePass(); setLocked(false) }
        else{
          pTitle.textContent='Try Again'; pDots.classList.add('shake');
          setTimeout(function(){ pDots.classList.remove('shake'); entry=''; busy=false; drawPass() },450);
        }
      },150);
    }
  }
  function backOrCancel(){ if(busy) return; if(entry.length){entry=entry.slice(0,-1);drawPass()} else hidePass() }
  ['1','2','3','4','5','6','7','8','9','','0','side'].forEach(function(k){
    var el;
    if(k===''){ el=document.createElement('span') }
    else if(k==='side'){ el=document.createElement('button'); el.type='button'; el.className='p-side'; el.textContent='Cancel'; pSide=el; el.addEventListener('click',backOrCancel) }
    else{ el=document.createElement('button'); el.type='button'; el.className='p-key'; el.innerHTML='<b>'+k+'</b><small>'+(LET[k]||'')+'</small>'; el.setAttribute('aria-label',k); el.addEventListener('click',function(){enterDigit(k)}) }
    pPad.appendChild(el);
  });
  document.addEventListener('keydown',function(e){
    if(!passOpen) return;
    if(/^[0-9]$/.test(e.key)) enterDigit(e.key);
    else if(e.key==='Backspace') backOrCancel();
    else if(e.key==='Escape') hidePass();
  });

  /* Swipe up from the home indicator (or anywhere on the lock screen). The indicator and the screen follow the finger. */
  function swipeUp(){ if(locked){ if(!passOpen) showPass() } else if(current) closeApp() }
  var bar=$('homebar'), barI=bar.querySelector('i');
  function dragTarget(){ if(passOpen) return null; if(locked) return lock; if(current) return appEl; return null }
  function applyDrag(t,dy){
    var p=Math.min(dy,320);
    barI.style.transform='translateY('+(-Math.min(dy*0.4,26))+'px)';
    if(t===lock){ t.style.transform='translateY('+(-p*0.6)+'px)'; t.style.opacity=String(1-p/520) }
    else if(t===appEl){ t.style.transform='translateY('+(-p*0.35)+'px) scale('+(1-p/320*0.28)+')'; t.style.opacity=String(1-p/700); t.style.borderRadius=(40+p/6)+'px' }
  }
  function attachDrag(el){
    var sy=null,dy=0,t=null;
    el.addEventListener('pointerdown',function(e){
      sy=e.clientY; dy=0; t=dragTarget();
      try{el.setPointerCapture(e.pointerId)}catch(x){}
      bar.classList.add('drag'); if(t) t.classList.add('drag');
    });
    el.addEventListener('pointermove',function(e){
      if(sy===null) return;
      dy=Math.max(0,sy-e.clientY); applyDrag(t,dy);
    });
    function end(commit){
      if(sy===null) return;
      sy=null;
      bar.classList.remove('drag'); barI.style.transform='';
      if(t){ t.classList.remove('drag'); t.style.transform=''; t.style.opacity=''; t.style.borderRadius='' }
      var go=commit&&dy>70; t=null;
      if(go) swipeUp();
    }
    el.addEventListener('pointerup',function(){end(true)});
    el.addEventListener('pointercancel',function(){end(false)});
  }
  attachDrag(bar);
  attachDrag(lock);
  $('island').addEventListener('click',function(){ if(!locked&&!current) setLocked(true) });

  /* App shell */
  function openApp(id,meta){
    if(current) return;
    current=id;
    var r=RENDER[id];
    appEl.className='app'; appEl.hidden=false;
    var dark=false;
    appEl.innerHTML='';
    if(r){ dark=r(appEl)||false } else { empty(appEl,meta||{name:id,id:id}) }
    appEl.classList.toggle('black',dark);
    phone.dataset.bar=dark?'light':'dark';
    $('homebar').querySelector('i').style.background='';
    void appEl.offsetWidth; appEl.classList.add('in');
    if(dark) phone.dataset.bar='light';
  }
  function closeApp(instant){
    if(!current) return;
    if(cleanup){cleanup();cleanup=null}
    current=null; phone.dataset.bar='light';
    appEl.classList.remove('in');
    if(instant){appEl.hidden=true;appEl.innerHTML='';return}
    setTimeout(function(){ if(!current){appEl.hidden=true;appEl.innerHTML=''} },260);
  }
  function header(title,right){
    return '<div class="bar"><h1>'+title+'</h1>'+(right||'')+'</div>';
  }
  function empty(el,a){
    el.innerHTML='<div class="empty"><span class="icon">'+(a.icon||ICON[a.id]||ICON.files)+'</span><strong style="font-size:22px">'+esc(a.name)+'</strong><p>This app is not included in the demo. Swipe up from the bottom or press the home bar to go back.</p></div>';
  }

  var RENDER={};

  /* Calculator */
  RENDER.calculator=function(el){
    var cur='0',prev=null,op=null,fresh=false;
    el.innerHTML='<div class="calc"><div class="out" id="cOut">0</div><div class="keys" id="keys"></div></div>';
    var keys=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],['.'],['=','op']];
    var K=$('keys'),out=$('cOut');
    function fmt(s){
      if(s==='Error') return s;
      var neg=s[0]==='-',t=neg?s.slice(1):s,p=t.split('.');
      p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
      return (neg?'-':'')+p.join('.');
    }
    function show(){
      var s=fmt(cur);out.textContent=s;
      out.style.fontSize=(s.length>9?42:s.length>7?58:s.length>6?68:84)+'px';
      K.querySelectorAll('.op').forEach(function(b){b.classList.toggle('on',fresh&&op===b.dataset.k&&b.dataset.k!=='=')});
      K.querySelector('[data-k="AC"]').textContent=(cur==='0'&&prev===null)?'AC':'C';
    }
    function calc(a,b,o){
      var r=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:(b===0?NaN:a/b);
      return isFinite(r)?String(parseFloat(r.toPrecision(9))):'Error';
    }
    function press(k){
      if(cur==='Error'&&k!=='AC'){return}
      if(/^\d$/.test(k)){ if(fresh||cur==='0'){cur=k}else if(cur.replace(/[-.]/g,'').length<9){cur+=k} fresh=false }
      else if(k==='.'){ if(fresh){cur='0.';fresh=false}else if(cur.indexOf('.')<0){cur+='.'} }
      else if(k==='AC'){ cur='0';if(!(prev===null)&&false){} prev=null;op=null;fresh=false }
      else if(k==='±'){ if(cur!=='0') cur=cur[0]==='-'?cur.slice(1):'-'+cur }
      else if(k==='%'){ cur=String(parseFloat((parseFloat(cur)/100).toPrecision(9))) }
      else if(k==='='){ if(op!==null&&prev!==null){cur=calc(prev,parseFloat(cur),op);prev=null;op=null;fresh=true} }
      else { if(op!==null&&prev!==null&&!fresh){cur=calc(prev,parseFloat(cur),op)} prev=parseFloat(cur);op=k;fresh=true }
      show();
    }
    keys.forEach(function(k){
      var b=document.createElement('button');b.type='button';b.textContent=k[0];b.dataset.k=k[0];
      if(k[1]) b.className=k[1];
      if(k[0]==='AC') b.setAttribute('aria-label','Clear');
      b.addEventListener('click',function(){press(k[0])});
      K.appendChild(b);
    });
    show();
    return true;
  };

  /* Notes */
  var notes;
  try{notes=JSON.parse(store('wp-notes')||'null')}catch(e){notes=null}
  if(!Array.isArray(notes)||!notes.length) notes=[
    {t:'Welcome',b:'Welcome\nThis is a demo phone. Tap the + to start a note. Notes stay in this browser.'},
    {t:'Packing list',b:'Packing list\nCharger\nPassport\nHeadphones\nSunscreen'}
  ];
  function saveNotes(){store('wp-notes',JSON.stringify(notes))}
  RENDER.notes=function(el){
    function list(){
      el.innerHTML=header('Notes','<button class="link" type="button" id="nNew" aria-label="New note">+ New</button>')+'<div class="body"><div class="card" id="nList"></div></div>';
      var L=$('nList');
      notes.forEach(function(n,i){
        var lines=n.b.split('\n'),r=document.createElement('button');
        r.type='button';r.className='row';r.style.width='100%';r.style.textAlign='left';
        r.innerHTML='<div class="grow"><div class="note-title">'+esc(lines[0]||'New note')+'</div><div class="note-sub">'+esc(lines.slice(1).join(' ')||'No additional text')+'</div></div>';
        r.addEventListener('click',function(){edit(i)});
        L.appendChild(r);
      });
      $('nNew').addEventListener('click',function(){notes.unshift({t:'',b:''});saveNotes();edit(0)});
    }
    function edit(i){
      el.innerHTML='<div class="bar"><button class="link" type="button" id="nBack">‹ Notes</button><button class="link" type="button" id="nDel">Delete</button></div><div class="body"><textarea class="editor" id="nText" aria-label="Note text" placeholder="Start typing"></textarea></div>';
      var t=$('nText');t.value=notes[i].b;
      t.addEventListener('input',function(){notes[i].b=t.value;saveNotes()});
      $('nBack').addEventListener('click',function(){ if(!notes[i].b.trim()) notes.splice(i,1); saveNotes(); list() });
      $('nDel').addEventListener('click',function(){notes.splice(i,1);if(!notes.length)notes.push({t:'',b:'Untitled\n'});saveNotes();list()});
      if(!t.value) t.focus();
    }
    list();
  };

  /* Clock */
  RENDER.clock=function(el){
    var tab='time',sw=0,run=false,start=0,laps=[],timer=null;
    el.innerHTML=header('Clock')+'<div class="body"><div class="tabs" role="tablist"><button type="button" class="on" id="tT">Time</button><button type="button" id="tS">Stopwatch</button></div><div id="pane"></div></div>';
    function pad(n,l){return String(n).padStart(l||2,'0')}
    function f(ms){var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return pad(m)+':'+pad(s)+'.'+pad(c)}
    function draw(){
      var p=$('pane');
      if(tab==='time'){
        var d=clk();
        p.innerHTML='<div class="digital" id="dg">'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'</div><div class="muted" style="text-align:center">'+DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+'</div><div class="card" style="margin-top:22px"><div class="row"><div class="grow"><div style="font-weight:600">Local time</div><div class="note-sub">This device</div></div><div>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</div></div></div>';
      } else {
        p.innerHTML='<div class="sw" id="swv">'+f(sw)+'</div><div class="ctl"><button type="button" class="a" id="swL">'+(run?'Lap':'Reset')+'</button><button type="button" class="'+(run?'stop':'go')+'" id="swS">'+(run?'Stop':'Start')+'</button></div><div class="card" id="laps"></div>';
        $('swL').addEventListener('click',function(){ if(run){laps.unshift(sw)}else{sw=0;laps=[]} draw() });
        $('swS').addEventListener('click',function(){ if(run){run=false}else{run=true;start=Date.now()-sw} draw() });
        var L=$('laps');
        if(!laps.length) L.style.display='none';
        laps.forEach(function(v,i){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="grow">Lap '+(laps.length-i)+'</div><div style="font-variant-numeric:tabular-nums">'+f(v)+'</div>';L.appendChild(r)});
      }
    }
    function tick(){
      if(tab==='time'){var d=clk(),e=$('dg');if(e)e.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
      else if(run){sw=Date.now()-start;var v=$('swv');if(v)v.textContent=f(sw)}
    }
    $('tT').addEventListener('click',function(){tab='time';$('tT').classList.add('on');$('tS').classList.remove('on');draw()});
    $('tS').addEventListener('click',function(){tab='sw';$('tS').classList.add('on');$('tT').classList.remove('on');draw()});
    timer=setInterval(tick,50);
    cleanup=function(){clearInterval(timer)};
    draw();
  };

  /* Calendar */
  RENDER.calendar=function(el){
    var y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    var h='<div class="cal">'+['S','M','T','W','T','F','S'].map(function(d){return '<div class="h">'+d+'</div>'}).join('');
    for(var i=0;i<first;i++) h+='<div></div>';
    for(var d=1;d<=days;d++) h+='<div class="d'+(d===now.getDate()?' today':'')+'"><span>'+d+'</span></div>';
    h+='</div>';
    el.innerHTML='<div class="bar"><h1 style="color:var(--red)">'+MON[m]+' <span style="color:var(--paper-ink);font-weight:300">'+y+'</span></h1></div><div class="body">'+h+'<div class="sec" style="padding-left:0">Today</div><div class="card"><div class="row"><div class="grow"><div style="font-weight:600">Nothing scheduled</div><div class="note-sub">'+DOW[now.getDay()]+', '+MON[m]+' '+now.getDate()+'</div></div></div></div></div>';
  };

  /* Messages */
  RENDER.messages=function(el){
    var replies=['Sounds good!','Haha, same.','On my way.','Send me a photo later.','Okay, talk soon.','Perfect, see you then.'];
    el.innerHTML='<div class="bar" style="justify-content:center;flex-direction:column;gap:2px;padding-bottom:6px"><span style="font-size:13px;font-weight:600">Alex</span></div><div class="chat" id="chat"></div><form class="compose" id="cForm"><input type="text" id="cIn" placeholder="Message" autocomplete="off" aria-label="Message"><button type="submit" aria-label="Send">↑</button></form>';
    var C=$('chat');
    function add(t,c){var d=document.createElement('div');d.className='bub '+c;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight}
    add('Are we still on for dinner tonight?','in');
    $('cForm').addEventListener('submit',function(e){
      e.preventDefault();var i=$('cIn'),v=i.value.trim();if(!v)return;
      add(v,'out');i.value='';
      var to=setTimeout(function(){add(replies[Math.floor(Math.random()*replies.length)],'in')},900);
      var old=cleanup;cleanup=function(){clearTimeout(to);if(old)old()};
    });
  };

  /* Reminders */
  var todos;
  try{todos=JSON.parse(store('wp-todos')||'null')}catch(e){todos=null}
  if(!Array.isArray(todos)) todos=[{t:'Water the plants',d:false},{t:'Reply to Alex',d:false},{t:'Book a haircut',d:true}];
  RENDER.reminders=function(el){
    function draw(){
      el.innerHTML=header('Reminders')+'<div class="body"><div class="card" id="tl"></div><form class="add" id="tForm"><input type="text" id="tIn" placeholder="New reminder" aria-label="New reminder" autocomplete="off"><button type="submit">Add</button></form></div>';
      var L=$('tl');
      if(!todos.length) L.innerHTML='<div class="row muted">No reminders</div>';
      todos.forEach(function(t,i){
        var r=document.createElement('button');r.type='button';r.className='row';r.style.cssText='width:100%;text-align:left';
        r.innerHTML='<span class="chk'+(t.d?' on':'')+'"></span><span class="grow'+(t.d?' done':'')+'">'+esc(t.t)+'</span>';
        r.addEventListener('click',function(){t.d=!t.d;store('wp-todos',JSON.stringify(todos));draw()});
        L.appendChild(r);
      });
      $('tForm').addEventListener('submit',function(e){e.preventDefault();var v=$('tIn').value.trim();if(!v)return;todos.push({t:v,d:false});store('wp-todos',JSON.stringify(todos));draw();$('tIn').focus()});
    }
    draw();
  };

  /* Settings */
  RENDER.settings=function(el){
    function draw(){
      el.innerHTML=header('Settings')+'<div class="body"><div class="sec" style="padding-top:4px">Home screen wallpaper</div><div class="card"><div class="swatches" id="sws"></div><div class="row"><div class="grow">'+WALLS[wallIdx][0]+'</div></div></div><div class="sec">About</div><div class="card"><div class="row"><div class="grow">Name</div><span class="muted">SEHAN’S PHONE</span></div><div class="row"><div class="grow">Software</div><span class="muted">Web demo</span></div></div><p class="muted" style="font-size:13px;padding:14px 4px">Swipe up from the bottom edge to go home. Tap the island at the top of the screen to lock the phone. Time and date follow the clock on this device.</p></div>';
      var S=$('sws');
      WALLS.forEach(function(w,i){
        var b=document.createElement('button');b.type='button';b.className='sw-btn'+(i===wallIdx?' on':'');b.style.background=w[1];b.setAttribute('aria-label',w[0]);
        b.addEventListener('click',function(){setWall(i);draw()});S.appendChild(b);
      });
    }
    draw();
  };

  /* Weather (sample data) */
  RENDER.weather=function(el){
    var hrs=[['Now','31°'],['18','30°'],['19','28°'],['20','27°'],['21','26°'],['22','26°'],['23','25°']];
    var days=[['Today','25°','33°'],['Thu','25°','32°'],['Fri','24°','31°'],['Sat','24°','30°'],['Sun','25°','32°']];
    el.style.background='#2f6fb5';
    el.innerHTML='<div class="body" style="padding-top:0"><div class="wx"><div class="city">Jakarta</div><div class="temp">31°</div><div class="cond">Partly cloudy</div><div class="panel"><div class="muted" style="color:rgba(255,255,255,.75);font-size:12px;font-weight:600;letter-spacing:.4px;margin-bottom:8px">HOURLY FORECAST</div><div class="hours">'+hrs.map(function(h){return '<div><span>'+h[0]+'</span><span style="font-size:22px">●</span><span>'+h[1]+'</span></div>'}).join('')+'</div></div><div class="panel"><div style="color:rgba(255,255,255,.75);font-size:12px;font-weight:600;letter-spacing:.4px;margin-bottom:4px">5-DAY FORECAST</div>'+days.map(function(d){return '<div class="day"><span>'+d[0]+'</span><span>'+d[1]+' – '+d[2]+'</span></div>'}).join('')+'</div><div class="note-fine">Sample data for this demo</div></div></div>';
    el.querySelector('.body').style.padding='0';
    return true;
  };

  /* Photos (generated gradients) */
  RENDER.photos=function(el){
    var h='',i;
    for(i=0;i<21;i++){var a=(i*47)%360,b=(a+60+i*9)%360;h+='<i style="background:linear-gradient('+(i*35%360)+'deg,hsl('+a+',70%,'+(45+i%3*8)+'%),hsl('+b+',75%,'+(30+i%4*6)+'%))"></i>'}
    el.innerHTML=header('Photos')+'<div class="body"><div class="photos">'+h+'</div><p class="muted" style="text-align:center;font-size:13px;padding:14px">21 Generated Images</p></div>';
  };

  /* Live GMT clock and date. Runs every second, so the time and the date roll over with world time. */
  function p2(n){return String(n).padStart(2,'0')}
  var lastDay='';
  function renderDates(){
    $('wDow').textContent=DOW[now.getDay()];
    $('wDay').textContent=now.getDate();
    $('wMon').textContent=MON[now.getMonth()]+' '+now.getFullYear();
    $('lDate').textContent=DOW[now.getDay()]+', '+MON[now.getMonth()]+' '+now.getDate();
    var ic=document.querySelector('.cal-ic'); if(ic) ic.innerHTML=calIcon();
    if(current==='calendar') RENDER.calendar(appEl);
  }
  function tickClock(){
    now=clk();
    var t=p2(now.getHours())+':'+p2(now.getMinutes());
    $('sTime').textContent=t; $('lTime').textContent=t;
    var key=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();
    if(key!==lastDay){lastDay=key;renderDates()}
  }
  tickClock();
  setInterval(tickClock,1000);
})();
</script>

</body></html>
